name: Atualizar Radar de Vagas

on:
  schedule:
    - cron: '0 11,21 * * *'
  workflow_dispatch:

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar bibliotecas
        run: pip install requests beautifulsoup4

      - name: Rodar busca de vagas
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scraper.py

      - name: Publicar vagas novas no site
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Radar Vagas Bot"
          git add vagas.json index.html
          git commit -m "Atualização automática de vagas" || exit 0
          git push
